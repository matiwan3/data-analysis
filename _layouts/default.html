<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
{% seo %}
<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  .wrapper {
    max-width: 1100px !important;
    margin: 0 auto !important;
  }
  img {
    max-width: 100%;
    height: auto;
  }
  #title hr {
    border: none !important;
    border-top: 1px solid rgba(255,255,255,0.15) !important;
    width: 100% !important;
    margin: 20px 0 0 !important;
  }
  #title a.back-home {
    display: inline-block;
    margin-bottom: 10px;
    font-size: 0.95em;
  }
</style>
<script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
<script src="{{ '/assets/js/respond.js' | relative_url }}"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
{% include head-custom.html %}
</head>
<body>
<div class="wrapper">
<section>
<div id="title">
<a href="{{ '/' | relative_url }}" class="back-home">← Strona główna</a>
<h1>{{ site.title | default: site.github.repository_name }}</h1>
<p>{{ site.tagline | default: site.description | default: site.github.project_tagline }}</p>
<hr>
</div>
{{ content }}

<footer style="text-align:center; margin-top:60px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.15);">
  <a href="https://www.linkedin.com/in/matwandz/" target="_blank" style="margin:0 14px; color:inherit; font-size:1.6em;"><i class="fa-brands fa-linkedin"></i></a>
  <a href="https://www.youtube.com/channel/UC3zCsmmnayvJ_pNMImkqAVA" target="_blank" style="margin:0 14px; color:inherit; font-size:1.6em;"><i class="fa-brands fa-youtube"></i></a>
  <a href="https://github.com/matiwan3/data-analysis" target="_blank" style="margin:0 14px; color:inherit; font-size:1.6em;"><i class="fa-brands fa-github"></i></a>
</footer>
</section>
</div>
</body>
</html>
