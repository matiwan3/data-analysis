<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      nav.site-nav { text-align: center; margin: 15px 0 30px; }
      nav.site-nav a { margin: 0 14px; color: inherit; text-decoration: none; font-weight: 600; }
      nav.site-nav a:hover { text-decoration: underline; }
      footer.site-footer-custom {
        text-align: center;
        margin-top: 60px;
        padding-top: 20px;
        padding-bottom: 30px;
        border-top: 1px solid rgba(255,255,255,0.15);
      }
      footer.site-footer-custom a { margin: 0 14px; color: inherit; text-decoration: none; font-size: 1.05em; }
      footer.site-footer-custom a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header class="page-header" role="banner">
      <h1 class="project-name">{{ page.title | default: site.title }}</h1>
      <h2 class="project-tagline">{{ page.description | default: site.description }}</h2>
      <nav class="site-nav">
        <a href="#o-mnie">O mnie</a>
        <a href="#projekty">Projekty</a>
        <a href="#blog">Blog</a>
      </nav>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer-custom">
      <a href="https://www.linkedin.com/in/matwandz/" target="_blank">🔗 LinkedIn</a>
      <a href="https://www.youtube.com/channel/UC3zCsmmnayvJ_pNMImkqAVA" target="_blank">🎥 YouTube</a>
      <a href="https://github.com/matiwan3/data-analysis" target="_blank">💻 GitHub</a>
    </footer>
  </body>
</html>
