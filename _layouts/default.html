<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
{% seo %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #0a0b0f;
    --card: #15161d;
    --border: rgba(255,255,255,0.08);
    --text: #f1f3f5;
    --muted: #8b92a0;
    --accent: #22c55e;
    --accent2: #4f8dff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 24px 16px 60px;
    line-height: 1.65;
  }
  .wrapper {
    max-width: 760px;
    margin: 0 auto;
  }

  .site-nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .site-nav a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95em;
    font-weight: 600;
  }
  .site-nav a:hover { color: var(--accent2); }
  #title { margin-bottom: 30px; text-align: center; }
  #title h1 {
    font-size: 2.6em;
    font-weight: 800;
    letter-spacing: 0.04em;
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #title p { color: var(--muted); margin: 0; font-size: 1.05em; }
  #title hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0 0;
  }

  h1, h2, h3, h4 { color: var(--text); line-height: 1.3; }
  h2 { margin-top: 40px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  h3 { margin-top: 28px; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent2); text-decoration: underline; }

  p, li { color: var(--text); }

  hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }

  img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin: 16px 0;
  }

  code {
    background: #12141a;
    color: var(--accent2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  pre {
    background: #12141a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; color: var(--text); }
    .img-right {
    float: right;
    width: 38%;
    max-width: 280px;
    margin: 4px 0 16px 24px;
  }
  .img-left {
    float: left;
    width: 38%;
    max-width: 280px;
    margin: 4px 24px 16px 0;
  }
  .clear { clear: both; }
  @media (max-width: 640px) {
    .img-right, .img-left {
      float: none;
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 16px auto;
    }
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
  }
  th, td {
    padding: 8px 12px;
    border: 1px solid var(--border);
    text-align: left;
  }
  th {
    background: var(--card);
    color: var(--muted);
    font-weight: 600;
  }

  blockquote {
    border-left: 3px solid var(--accent);
    margin: 16px 0;
    padding: 4px 16px;
    color: var(--muted);
    background: var(--card);
    border-radius: 0 8px 8px 0;
  }

  footer.site-footer-custom {
    text-align: center;
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  footer.site-footer-custom .footer-links {
    margin-bottom: 14px;
    font-size: 0.9em;
  }
  footer.site-footer-custom .footer-links a {
    color: var(--muted);
    text-decoration: none;
  }
  footer.site-footer-custom .footer-links a:hover { color: var(--accent); }
  footer.site-footer-custom .social a {
    margin: 0 14px;
    color: var(--text);
    font-size: 1.6em;
  }
  footer.site-footer-custom .social a:hover { color: var(--accent); }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin: 20px 0 10px;
  }
  .tool-card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    color: var(--text) !important;
    text-decoration: none !important;
    transition: border-color 0.15s, transform 0.15s;
  }
  .tool-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .tool-card .tool-icon { font-size: 1.8em; margin-bottom: 10px; }
  .tool-card .tool-title { font-weight: 700; font-size: 1.05em; margin-bottom: 6px; }
  .tool-card .tool-desc { color: var(--muted); font-size: 0.88em; line-height: 1.5; }
  .tool-card .tool-cta { color: var(--accent); font-size: 0.85em; font-weight: 600; margin-top: 14px; display: inline-block; }
</style>
</head>
<body>
<div class="wrapper">
<section>
<nav class="site-nav">
  <a href="{{ '/' | relative_url }}">Strona główna</a>
  <a href="{{ '/' | relative_url }}#narzedzia">Narzędzia</a>
</nav>
<div id="title">
<h1>{{ site.title | default: site.github.repository_name }}</h1>
<p>{{ site.tagline | default: site.description | default: site.github.project_tagline }}</p>
<hr>
</div>

{{ content }}

<footer class="site-footer-custom">
  <div class="footer-links">
    <a href="{{ '/archiwum/' | relative_url }}">Archiwum (dawne projekty i treści)</a>
  </div>
  <div class="social">
    <a href="https://www.linkedin.com/in/matwandz/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
    <a href="https://www.youtube.com/channel/UC3zCsmmnayvJ_pNMImkqAVA" target="_blank"><i class="fa-brands fa-youtube"></i></a>
    <a href="https://github.com/matiwan3/data-analysis" target="_blank"><i class="fa-brands fa-github"></i></a>
  </div>
</footer>
</section>
</div>
</body>
</html>
